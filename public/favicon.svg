<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <style>
    :root {
      --bg-outer: #ffffff;
      --bg-inner: #000000;
      --fg-icon: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-outer: #000000;
        --bg-inner: #ffffff;
        --fg-icon: #000000;
      }
    }
    .bg-outer { fill: var(--bg-outer); }
    .bg-inner { fill: var(--bg-inner); }
    .fg-icon { fill: var(--fg-icon); }
  </style>
  <defs>
    <clipPath id="circle-clip">
      <rect width="1000" height="1000" x="0" y="0" rx="500" ry="500" />
    </clipPath>
  </defs>
  <g clip-path="url(#circle-clip)">
    <rect width="1000" height="1000" class="bg-outer" />
    <g transform="matrix(2,0,0,2,0,0)">
      <svg width="500" height="500" viewBox="0 0 1000 1000">
        <rect width="100%" height="100%" x="0" y="0" class="bg-inner" />
        <g>
          <path class="fg-icon" d="M 1 21 h 22 L 12 2" transform="matrix(1 0 0 1 500 500) matrix(22.045 0 0 22.045 -212.3276 0.0254) translate(-12, -11.5)" />
          <path class="fg-icon" d="M 15 2.013 H 9 V 9 H 2 v 6 h 7 v 6.987 h 6 V 15 h 7 V 9 h -7 z" transform="matrix(1 0 0 1 500 500) matrix(20.9725 0 0 20.9725 245.0971 -0.0002) translate(-12, -12)" />
        </g>
      </svg>
    </g>
  </g>
</svg>
